spring.application.name=projetoAcVansV4

spring.datasource.url=jdbc:mariadb://${MARIADB_IP_PORT}/bdacvans?sslMode=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=acvans_user
spring.datasource.password=${MARIADB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.session.persistent=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

jwt.access.secret=${CHAVE_JWT_ACESSO}
jwt.refresh.secret=${CHAVE_JWT_REFRESH}

spring.profiles.active=${AMBIENTE_ATIVO}

spring.data.redis.host=${REDIS_HOST_IP}
spring.data.redis.port=${REDIS_PORT}