spring.application.name=projetoAcVansV4

app.base-url=http://fooengineers.xyz

spring.datasource.url=jdbc:mariadb://localhost:3306/bdacvans?sslMode=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MARIADB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.session.persistent=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

jwt.access.secret=${CHAVE_JWT_ACESSO}
jwt.refresh.secret=${CHAVE_JWT_REFRESH}

spring.profiles.active=${AMBIENTE_ATIVO}